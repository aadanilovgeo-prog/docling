name: Build updated_scroll_capture.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "updated_scroll_capture.py"
      - "scroll_long_screenshot.py"
      - "updated_scroll_capture.spec"
      - ".github/workflows/build-updated-scroll-capture.yml"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller updated_scroll_capture.spec --noconfirm --clean

      - name: Show EXE info
        shell: pwsh
        run: |
          $f = Get-Item dist/updated_scroll_capture.exe
          Write-Host "Size bytes:" $f.Length
          Write-Host "Size MB:" ([math]::Round($f.Length / 1MB, 2))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated_scroll_capture-exe
          path: dist/updated_scroll_capture.exe
          retention-days: 90

      - name: Commit EXE to dist/
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/updated_scroll_capture.exe
          if (git diff --staged --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "Build updated_scroll_capture.exe [skip ci]"
            git push
          }
