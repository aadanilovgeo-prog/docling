name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.bat"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build run_docling_parse_v3.0.exe
        shell: cmd
        run: |
          cl /nologo /W4 /O2 /utf-8 /Fe:run_docling_parse_v3.0.exe src\run_docling_parse.c user32.lib
          if not exist run_docling_parse_v3.0.exe exit /b 1
          dir run_docling_parse_v3.0.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: run_docling_parse_v3.0-windows-x64
          path: run_docling_parse_v3.0.exe
          retention-days: 90
          if-no-files-found: error

      - name: Remove legacy release asset
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset latest-build run_docling_parse.exe -y 2>/dev/null || true

      - name: Publish GitHub Release (latest-build)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Windows EXE (v3.0)
          body: |
            Auto-built `run_docling_parse_v3.0.exe` from branch `main`.
            Place in project root next to `docs\` and double-click.
            Requires `docling` in PATH (`pip install docling`).
          files: run_docling_parse_v3.0.exe
          make_latest: true
          overwrite_files: true

      - name: Commit EXE to repo root on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f dist/run_docling_parse.exe dist/run_docling_parse_v3.0.exe 2>/dev/null || true
          git add run_docling_parse_v3.0.exe
          git diff --staged --quiet && echo "No EXE changes" && exit 0
          git commit -m "ci: update run_docling_parse_v3.0.exe [skip ci]"
          git push
