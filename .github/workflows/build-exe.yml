name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.bat"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build run_docling_parse_v3.0.exe
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /W4 /O2 /utf-8 /Fe:dist\run_docling_parse_v3.0.exe src\run_docling_parse.c user32.lib
          if not exist dist\run_docling_parse_v3.0.exe exit /b 1
          dir dist\run_docling_parse_v3.0.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: run_docling_parse_v3.0-windows-x64
          path: dist/run_docling_parse_v3.0.exe
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release (latest-build)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Windows EXE
          body: |
            Auto-built `run_docling_parse_v3.0.exe` from branch `main`.
            Place next to `docs\` and double-click. Requires `docling` in PATH.
          files: dist/run_docling_parse_v3.0.exe
          make_latest: true
          overwrite_files: true

      - name: Commit EXE to dist/ on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/run_docling_parse_v3.0.exe
          git diff --staged --quiet && echo "No EXE changes" && exit 0
          git commit -m "ci: update dist/run_docling_parse_v3.0.exe [skip ci]"
          git push
